    <rect x="12" y="12" width="12" height="12" rx="2" fill="#ff2e93"/>
    <rect x="26" y="12" width="12" height="12" rx="2" fill="#00e5ff"/>
    <rect x="40" y="12" width="12" height="12" rx="2" fill="#ffd23f"/>
    <rect x="12" y="26" width="12" height="12" rx="2" fill="#00ffc8"/>
    <rect x="26" y="26" width="12" height="12" rx="2" fill="#7928ff"/>
    <rect x="40" y="26" width="12" height="12" rx="2" fill="#ff4fa3"/>
    <rect x="12" y="40" width="12" height="12" rx="2" fill="#ffd23f"/>
    <rect x="26" y="40" width="12" height="12" rx="2" fill="#ff2e93"/>
    <rect x="40" y="40" width="12" height="12" rx="2" fill="#00e5ff"/>
  </g>
</svg>
