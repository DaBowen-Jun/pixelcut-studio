<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PixelCut 访问统计</title>
<style>
  :root{ --bg:#0e1018; --card:#181b29; --line:#262a3d; --txt:#e8eaf2; --sub:#8b90a8; --red:#ff5000; --blue:#3a9bd1; --green:#3fae5a; --gold:#ffb400; }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--txt);padding:28px 16px 60px;}
  .wrap{max-width:920px;margin:0 auto;}
  h1{font-size:20px;font-weight:800;margin-bottom:4px;}
  .sub{color:var(--sub);font-size:13px;margin-bottom:22px;}
  .grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;}
  .card .k{font-size:12px;color:var(--sub);margin-bottom:8px;}
  .card .v{font-size:30px;font-weight:800;line-height:1;}
  .card .v small{font-size:14px;color:var(--sub);font-weight:600;}
  .c1 .v{color:var(--red);} .c2 .v{color:var(--blue);} .c3 .v{color:var(--green);} .c4 .v{color:var(--gold);}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:18px;}
  .panel h2{font-size:14px;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:7px;}
  .panel h2::before{content:"";width:4px;height:14px;background:var(--red);border-radius:2px;}
  .bars{display:flex;align-items:flex-end;gap:5px;height:150px;}
  .bars .b{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;}
  .bars .b .bar{width:100%;background:linear-gradient(180deg,var(--red),#ff8a4d);border-radius:4px 4px 0 0;min-height:2px;transition:height .3s;}
  .bars .b .lab{font-size:9px;color:var(--sub);margin-top:5px;transform:rotate(45deg);white-space:nowrap;}
  .legend{font-size:11px;color:var(--sub);margin-top:10px;}
  .list .row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:13px;}
  .list .row:last-child{border-bottom:none;}
  .list .name{flex:1;color:var(--txt);}
  .list .num{font-weight:700;color:var(--red);}
  .meter{flex:2;height:8px;background:#0e1018;border-radius:5px;overflow:hidden;}
  .meter i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),#6ad0ff);border-radius:5px;}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
  .err{color:#ff6b6b;font-size:13px;padding:20px;text-align:center;}
  /* ---- 实时在线 ---- */
  .livebar{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;
    background:linear-gradient(135deg,#1d2233,#181b29);border:1px solid var(--line);border-radius:14px;
    padding:18px 20px;margin-bottom:22px;}
  .livebar .left{display:flex;align-items:center;gap:16px;}
  .pulse{position:relative;width:14px;height:14px;flex:none;}
  .pulse i{position:absolute;inset:0;background:var(--green);border-radius:50%;}
  .pulse i:first-child{animation:ping 1.8s cubic-bezier(0,0,.2,1) infinite;}
  @keyframes ping{ 0%{transform:scale(1);opacity:.8} 80%,100%{transform:scale(2.6);opacity:0} }
  .livebar .num{font-size:42px;font-weight:800;color:var(--green);line-height:1;}
  .livebar .txt{font-size:12px;color:var(--sub);line-height:1.5;}
  .livebar .txt b{color:var(--txt);font-size:13px;display:block;margin-bottom:2px;}
  .livebar .right{font-size:11px;color:var(--sub);text-align:right;line-height:1.7;}
  .refresh{background:#22263a;border:1px solid var(--line);color:var(--txt);border-radius:8px;
    padding:5px 11px;font-size:11px;cursor:pointer;font-family:inherit;}
  .refresh:hover{border-color:var(--blue);color:var(--blue);}
  .live-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line);font-size:13px;flex-wrap:wrap;}
  .live-row:last-child{border-bottom:none;}
  .tag{font-size:11px;padding:2px 8px;border-radius:20px;background:#22263a;color:var(--sub);flex:none;}
  .tag.path{color:var(--blue);} .tag.co{color:var(--gold);} .tag.dv{color:var(--green);}
  .live-row .spacer{flex:1;}
  .ago{font-size:11px;color:var(--sub);flex:none;}
  .ago b{color:var(--green);font-weight:700;}
  .filewarn{background:var(--card);border:1px solid var(--red);border-radius:14px;padding:22px;margin-bottom:22px;}
  .filewarn h3{font-size:14px;color:var(--red);margin-bottom:10px;}
  .filewarn p{font-size:12px;color:var(--sub);line-height:1.8;margin-bottom:12px;}
  .filewarn a{display:inline-block;background:var(--red);color:#fff;border-radius:8px;padding:8px 16px;font-size:13px;text-decoration:none;font-weight:700;}
  @media(max-width:640px){ .grid4{grid-template-columns:repeat(2,1fr);} .two{grid-template-columns:1fr;}
    .livebar .num{font-size:34px;} .livebar .right{text-align:left;} }
</style>
</head>
<body>
<div class="wrap">
  <h1>📊 PixelCut 访问统计</h1>
  <div class="sub">自有数据 · 存于 Cloudflare KV · 口令保护 · 时区：北京时间</div>
  <div id="app"><div class="err">正在加载…</div></div>
</div>

<script>
const KEY_STORE='pc_stats_key';
const APP_URL='https://pixelcut-studio.pages.dev/stats';
function askKey(){
  let k=sessionStorage.getItem(KEY_STORE);
  if(!k){ k=prompt('请输入统计口令（默认 pixelcut2026）：')||''; if(k) sessionStorage.setItem(KEY_STORE,k); }
  return k;
}

// file:// 协议下 fetch 跨域受限，直接给出明确提示
if(location.protocol==='file:'){
  document.getElementById('app').innerHTML=
    '<div class="filewarn"><h3>请通过 HTTPS 链接打开本页面</h3>'+
    '<p>本地双击打开 stats.html 时，浏览器会把它当成 file:// 文件。<br>'+
    '出于安全限制，file:// 文件不能调用 https:// 接口，所以出现 "Failed to fetch"。</p>'+
    '<p>正确打开方式：'+APP_URL+'</p>'+
    '<a href="'+APP_URL+'" target="_blank">点我在线打开</a></div>';
  throw new Error('file protocol not supported');
}

const DEV_NAME={mobile:'手机',tablet:'平板',desktop:'电脑'};
function fmtAgo(s){ if(s<60) return s+'秒前'; if(s<3600) return Math.floor(s/60)+'分钟前'; return Math.floor(s/3600)+'小时前'; }
function fmtDur(s){ if(s<60) return '<1分钟'; if(s<3600) return Math.floor(s/60)+'分钟'; return Math.floor(s/3600)+'小时'+Math.floor((s%3600)/60)+'分'; }

let TIMER=null;
async function load(first){
  let key=askKey();
  const app=document.getElementById('app');
  if(!key){ app.innerHTML='<div class="err">未输入口令</div>'; return; }
  try{
    const r=await fetch('/api/stats',{headers:{'x-stats-key':key}});
    if(r.status===401){ sessionStorage.removeItem(KEY_STORE); if(TIMER)clearInterval(TIMER); app.innerHTML='<div class="err">口令错误，刷新重试</div>'; return; }
    if(!r.ok) throw new Error('HTTP '+r.status);
    const d=await r.json();
    if(first) render(d);
    updateLive(d);
  }catch(e){
    if(first){
      const isCors = e.name==='TypeError' || e.message.includes('Failed to fetch');
      app.innerHTML='<div class="err">加载失败：'+e.message+'<br><span style="color:var(--sub);font-size:12px">'+
        (isCors?'常见原因：用 file:// 双击打开 / 网络受限 / 口令过期':'')+
        '</span><br><a href="'+APP_URL+'" style="color:var(--blue);font-size:12px">'+APP_URL+'</a></div>';
    }
  }
}
function startAuto(){ if(TIMER)clearInterval(TIMER); TIMER=setInterval(function(){ load(false); },30000); }

function updateLive(d){
  const o=d.online||{count:0,list:[],paths:{},countries:{},devices:{}};
  const numEl=document.getElementById('liveNum');
  if(!numEl) return;

  numEl.textContent=o.count;

  const ps=topObj(o.paths,3).map(x=>x[0]+' ×'+x[1]).join('　');
  const cs=topObj(o.countries,3).map(x=>(x[0]==='XX'?'未知':x[0])+' ×'+x[1]).join('　');
  document.getElementById('liveBreak').innerHTML=
    (o.count===0?'<span style="color:var(--sub)">当前没有访客在站上</span>'
                 :(ps?'📄 '+ps+'<br>':'')+(cs?'🌍 '+cs:''))||'<span style="color:var(--sub)">当前没有访客在站上</span>';

  const listEl=document.getElementById('liveList');
  if(o.count===0){
    listEl.innerHTML='<div class="err" style="padding:12px">暂无在线访客</div>';
  }else{
    listEl.innerHTML=o.list.map(function(v){
      return '<div class="live-row">'
        +'<span class="tag path">'+v.path+'</span>'
        +'<span class="tag co">'+(v.country==='XX'?'未知':v.country)+'</span>'
        +'<span class="tag dv">'+(DEV_NAME[v.device]||v.device)+'</span>'
        +'<span class="spacer"></span>'
        +'<span class="ago">停留 '+fmtDur(v.duration)+' · <b>'+fmtAgo(v.ago)+'</b></span>'
        +'</div>';
    }).join('');
  }
  document.getElementById('liveTime').textContent=new Date().toLocaleTimeString('zh-CN',{hour12:false});
}
function topObj(o,n){ return Object.entries(o||{}).sort((a,b)=>b[1]-a[1]).slice(0,n); }
function render(d){
  const last14=d.days.slice(-14);
  const maxPv=Math.max(1,...last14.map(x=>x.pv));
  const bars=last14.map(x=>{
    const h=Math.round((x.pv/maxPv)*100);
    const mm=x.date.slice(5);
    return `<div class="b"><div class="bar" style="height:${h}%"></div><div class="lab">${mm}</div></div>`;
  }).join('');
  const tp=topObj(d.paths,8); const co=topObj(d.countries,8); const dv=d.devices||{};
  const maxPath=Math.max(1,...tp.map(x=>x[1]));
  const maxCo=Math.max(1,...co.map(x=>x[1]));
  const pathRows=tp.length? tp.map(([p,c])=>`<div class="row"><span class="name">${p}</span><span class="meter"><i style="width:${Math.round(c/maxPath*100)}%"></i></span><span class="num">${c}</span></div>`).join('') : '<div class="err">暂无数据</div>';
  const coRows=co.length? co.map(([c,n])=>`<div class="row"><span class="name">${c==='XX'?'未知':c}</span><span class="meter"><i style="width:${Math.round(n/maxCo*100)}%"></i></span><span class="num">${n}</span></div>`).join('') : '<div class="err">暂无数据</div>';
  const devTotal=(dv.mobile||0)+(dv.desktop||0)+(dv.tablet||0)||1;
  const devRows=['mobile','tablet','desktop'].map(k=>{
    const n=dv[k]||0; const label={mobile:'手机',tablet:'平板',desktop:'电脑'}[k];
    return `<div class="row"><span class="name">${label}</span><span class="meter"><i style="width:${Math.round(n/devTotal*100)}%"></i></span><span class="num">${n}</span></div>`;
  }).join('');

  document.getElementById('app').innerHTML=`
    <div class="livebar">
      <div class="left">
        <span class="pulse"><i></i><i></i></span>
        <span class="num" id="liveNum">0</span>
        <span class="txt"><b>实时在线人数</b>最近 5 分钟内有活动的独立访客</span>
      </div>
      <div class="right">
        <div>更新于 <span id="liveTime">--:--:--</span></div>
        <button class="refresh" onclick="load(false)">立即刷新</button>
        <span>每 30 秒自动更新</span>
      </div>
    </div>
    <div class="panel">
      <h2>🟢 在线访客明细</h2>
      <div id="liveBreak" style="font-size:12px;color:var(--sub);margin-bottom:12px;line-height:1.8">加载中…</div>
      <div id="liveList"></div>
    </div>
    <div class="grid4">
      <div class="card c1"><div class="k">今日 PV</div><div class="v">${d.today.pv}</div></div>
      <div class="card c2"><div class="k">今日 UV</div><div class="v">${d.today.uv}</div></div>
      <div class="card c3"><div class="k">近30天 PV</div><div class="v">${d.windowPv}</div></div>
      <div class="card c4"><div class="k">近30天 UV</div><div class="v">${d.windowUv}</div></div>
    </div>
    <div class="panel">
      <h2>近 14 天访问趋势（PV）</h2>
      <div class="bars">${bars}</div>
      <div class="legend">柱高 = 当日 PV 相对峰值；鼠标无需操作，数据为北京时间每日累计</div>
    </div>
    <div class="two">
      <div class="panel"><h2>热门页面</h2><div class="list">${pathRows}</div></div>
      <div class="panel"><h2>访客国家/地区</h2><div class="list">${coRows}</div></div>
    </div>
    <div class="panel"><h2>设备分布</h2><div class="list">${devRows}</div></div>
  `;
}
load(true);
startAuto();
</script>
</body>
</html>
